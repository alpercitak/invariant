version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0"]
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      minor-and-patch:
        update-types: [minor, patch]
